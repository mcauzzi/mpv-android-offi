name: build

on:
  - push
  - pull_request
  - workflow_dispatch

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin

      - name: Export env vars
        run: buildscripts/include/ci.sh export >>$GITHUB_ENV

      - uses: actions/cache@v6
        with:
          path: gh-cache/
          key: "${{ env.CACHE_IDENTIFIER }}"
          enableCrossOsArchive: true

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install autoconf pkgconf libtool ninja-build python3-pip gperf nasm
          sudo pip3 install meson

      - name: Download or build deps
        run: |
          mkdir -p "$CACHE_FOLDER"
          buildscripts/include/ci.sh install
        env:
          CACHE_MODE: "folder"
          CACHE_FOLDER: "${{ github.workspace }}/gh-cache"

      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d >"$RUNNER_TEMP/release.jks"
          echo "ANDROID_SIGNING_KEY=$RUNNER_TEMP/release.jks" >>$GITHUB_ENV

      - name: Build
        env:
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          buildscripts/include/ci.sh build

      - uses: actions/upload-artifact@v7
        with:
          name: mpv-android-signed
          path: |
            app/build/outputs/apk/*/release/*-signed.apk
            app/build/outputs/apk/*/debug/*-signed.apk
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: mpv-android-armeabi-v7a
          path: app/build/outputs/apk/default/debug/app-default-armeabi-v7a-debug.apk
          archive: false

      - uses: actions/upload-artifact@v7
        with:
          name: mpv-android-arm64-v8a
          path: app/build/outputs/apk/default/debug/app-default-arm64-v8a-debug.apk
          archive: false
